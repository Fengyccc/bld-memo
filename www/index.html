<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>盲拧联想词查询</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>盲拧联想词</h1>
    <nav class="tabs">
      <button class="tab active" data-tab="query">查询</button>
      <button class="tab" data-tab="settings">设置</button>
    </nav>
  </header>

  <main>
    <!-- 查询 -->
    <section id="query-view" class="view active">
      <div class="card">
        <label class="field-label" for="seq-input">输入字母对，或整串字母序列（自动按两个字母分组，末尾单个字母单独查询）</label>
        <input id="seq-input" type="text" placeholder="例如：AB　或　AB CD EF G　或直接粘贴 ABCDEFG" autocomplete="off" spellcheck="false">
        <div id="query-results" class="results"></div>
      </div>

      <div class="card">
        <label class="field-label" for="reverse-input">按联想词反查字母对</label>
        <input id="reverse-input" type="text" placeholder="输入联想词关键词" autocomplete="off">
        <div id="reverse-results" class="results"></div>
      </div>
    </section>

    <!-- 设置 -->
    <section id="settings-view" class="view">
      <div class="card">
        <h2>字母表</h2>
        <p class="hint">用空格或逗号分隔每个字母（每个字母必须是单个字符）。改动后点击「应用字母表」。</p>
        <textarea id="alphabet-input" rows="2" spellcheck="false"></textarea>
        <div class="row">
          <span id="alphabet-count" class="muted"></span>
          <button id="apply-alphabet" class="btn primary">应用字母表</button>
        </div>
      </div>

      <div class="card">
        <h2>联想词管理</h2>
        <p class="hint">点击「单字母」或字母对单元格进行编辑，可同时填写联想词与读音。斜线（自身组合，如 AA）不使用。</p>
        <div id="progress" class="muted progress"></div>

        <h3 class="sub">单字母编码</h3>
        <div id="single-row" class="single-row"></div>

        <h3 class="sub">双字母编码（字母对）</h3>
        <div id="dict-grid" class="dict-grid"></div>

        <div id="edit-panel" class="edit-panel hidden">
          <span class="edit-code" id="edit-code">—</span>
          <input id="edit-word" type="text" placeholder="联想词" autocomplete="off">
          <input id="edit-pron" type="text" placeholder="读音（可选）" autocomplete="off">
          <button id="edit-save" class="btn primary">保存</button>
          <button id="edit-clear" class="btn">清空</button>
          <button id="edit-cancel" class="btn">取消</button>
        </div>
      </div>

      <div class="card">
        <h2>数据管理</h2>
        <div class="row wrap">
          <button id="export-json" class="btn">导出 JSON</button>
          <button id="import-json" class="btn">导入 JSON</button>
          <button id="export-excel" class="btn">导出 Excel</button>
          <button id="reset-data" class="btn danger">恢复默认</button>
        </div>
        <div class="row wrap">
          <button id="import-excel" class="btn">导入 Excel / CSV</button>
          <button id="download-template" class="btn">下载模板</button>
        </div>
        <p class="hint" style="margin-top:10px">数据自动保存在浏览器本地，建议定期「导出 JSON」备份。</p>
      </div>
    </section>
  </main>

  <!-- 导入/确认弹窗 -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modal-title">导入预览</h3>
      <p id="modal-summary"></p>
      <div id="modal-list" class="modal-list"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn">取消</button>
        <button id="modal-confirm" class="btn primary">确认</button>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" hidden>

  <script src="lib/xlsx.full.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
